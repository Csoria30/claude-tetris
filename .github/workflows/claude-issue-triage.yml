name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} de este repositorio (título y cuerpo).

            1. Revisa las labels ya existentes en el repo (bug, enhancement, documentation,
               question, help wanted, good first issue, duplicate, invalid, wontfix) y asigna
               al issue las que correspondan según su contenido. No crees labels nuevas.
            2. Publica un comentario en el issue con un diagnóstico general del problema:
               - Causa probable.
               - Qué parte del código está involucrada (referencia game.js según la
                 arquitectura descrita en CLAUDE.md: estado del tablero, piezas, colisión,
                 game loop, rendering, HUD, etc.).
               - Qué se necesitaría para implementar la solución (a alto nivel).
               No implementes la solución ni edites archivos del repo: este comentario es
               solo un diagnóstico para preparar un PR posterior.
          # Ver https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # o https://code.claude.com/docs/en/cli-reference para más opciones
